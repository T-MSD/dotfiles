# ==========================
# ===    Base Settings    ===
# ==========================
set-option -g default-shell /bin/zsh

set -g extended-keys-format csi-u

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Extended keys so the terminal can send Ctrl+Tab (needs CSI u support, e.g. Ghostty)
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'

# Cycle sessions with Ctrl+Tab, like WezTerm tabs (no prefix needed)
bind -n C-Tab switch-client -n
bind -n C-S-Tab switch-client -p

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

set -g mouse on
set-option -g status-position top
set-option -g allow-rename off

# Ghostty's window title (also the subtitle of its desktop notifications)
# follows the current tmux window instead of "tmux attach -t 0".
set -g set-titles on
set -g set-titles-string '#W'

set -g allow-passthrough on

# Focus events help native notifications; the bell surfaces an agent finishing
# in a background pane.
set -g focus-events on
set -g monitor-bell on
set -g bell-action any

# ==========================
# ===      Plugins       ===
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# No theme plugin -- the bar is generated (see below). Two of them would fight
# over the whole status bar anyway; last one loaded silently wins.
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @plugin 'rose-pine/tmux'
# Must load after status-right is set: it string-replaces #{battery_*} at load time.
set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'catppuccin/tmux#v2.1.3'

# ==============================================================================
# ===   Theme (generated)                                                    ===
# ==============================================================================
# Written by `theme <name>`: layout from ~/.config/theme/templates/tmux.conf.in,
# colours from ~/.config/theme/themes/<name>.sh. Don't edit theme.conf directly.
# Must stay ABOVE the TPM line so status-right exists before tmux-battery loads.
source-file -q ~/.config/tmux/theme.conf

# ==========================
# ===       Battery      ===
# ==========================
# Monochrome Nerd Font glyphs instead of the plugin's default emoji.
set -g @batt_icon_status_charged '󰂄'
set -g @batt_icon_status_charging '󰂄'
set -g @batt_icon_status_discharging '󰁹'
set -g @batt_icon_status_attached '󰂃'
set -g @batt_icon_status_unknown '󰂑'

# ==========================
# == cc-auto-rename-window ==
# ==========================
# Windows running Claude Code take the session title (/rename, --resume).
# Lives outside ~/.tmux/plugins so TPM's clean doesn't remove it.
# set -g @cc-auto-rename-window-max 30
run-shell "$HOME/.config/tmux/plugins/cc-auto-rename-window/cc-auto-rename-window.tmux"

# ==========================
# ===    pane-notify     ===
# ==========================
# Badge, status bell, sidebar (prefix a) and desktop notification when a long
# command finishes or Claude is waiting for input. Colours follow the theme's
# @thm_* palette (theme.conf); the badge and bell are placed by the formats in
# ~/.config/theme/templates/tmux.conf.in.
set -g @pane-notify-color-done '#{@thm_foam}'
set -g @pane-notify-color-failed '#{@thm_love}'
set -g @pane-notify-color-waiting '#{@thm_accent}'
set -g @pane-notify-color-status '#{@thm_accent}'
set -g @pane-notify-icon-status "\U000F009A  "   # nf-md-bell; Ghostty draws it two cells wide
set -g @pane-notify-sidebar-text '#{@thm_text}'
set -g @pane-notify-sidebar-subtle '#{@thm_subtle}'
set -g @pane-notify-sidebar-muted '#{@thm_muted}'
set -g @pane-notify-sidebar-rule '#{@thm_hl_high}'
run-shell "$HOME/repos/dev/pane-notify/pane-notify.tmux"

# ==========================
# ===   Initialize TPM   ===
# ==========================
run-shell "$HOME/.tmux/plugins/tpm/tpm"

# Transparency (Must be at the very bottom)
# -a APPENDS to status-style. A plain `set -g status-style "bg=default"` here
# would REPLACE the whole style and silently discard the fg that theme.conf set,
# leaving the bar's default foreground as the terminal's rather than the theme's.
set -ag status-style "bg=default"
